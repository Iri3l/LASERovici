# Please do not edit this file.
# Build steps can be customized in the LASERovici-build.yaml.
# More information under https://docs.ionos.space/docs/github-actions-customization/
# version: 2022-07-21

name: "Deploy Now: Orchestration"
run-name: "Deploy Now: Build LASERovici · ${{ github.event.head_commit.message || format('Triggered by {0}', github.triggering_actor) }}"

on:
  push:
    branches:
      - '**'  # Run on all branches
    tags-ignore:
      - '**'  # Ignore all tags (IONOS Deploy Now works with branches only)
  workflow_dispatch:

jobs:
  retrieve-project:
    name: check readiness
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ steps.parse.outputs.deployment-enabled }}
      branch-id: ${{ steps.parse.outputs.branch-id }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 1d4290bb-1634-4dd1-9de6-8a5e55b910ba
          action: retrieve-info
      
      - name: Parse project info
        id: parse
        run: |
          INFO='${{ steps.project.outputs.info }}'
          if [ -z "$INFO" ] || [ "$INFO" = "null" ] || [ "$INFO" = "" ]; then
            echo "deployment-enabled=false" >> $GITHUB_OUTPUT
            echo "branch-id=" >> $GITHUB_OUTPUT
          else
            # Try to parse JSON, fallback to false if it fails
            DEPLOYMENT_ENABLED=$(echo "$INFO" | jq -r '.["deployment-enabled"] // "false"' 2>/dev/null || echo "false")
            BRANCH_ID=$(echo "$INFO" | jq -r '.["branch-id"] // ""' 2>/dev/null || echo "")
            echo "deployment-enabled=$DEPLOYMENT_ENABLED" >> $GITHUB_OUTPUT
            echo "branch-id=$BRANCH_ID" >> $GITHUB_OUTPUT
          fi


  build:
    name: build
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/LASERovici-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  deploy:
    name: trigger deployment
    needs:
      - retrieve-project
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment(s)
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 1d4290bb-1634-4dd1-9de6-8a5e55b910ba
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: dispatch-deployments
